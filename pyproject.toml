[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icy_gridworld"
version = "1.0.0"
description = "The CIS 5930 fixed stochastic Icy Grid World Gymnasium environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0,<2.0", "numpy>=1.26,<3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["icy_gridworld*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
